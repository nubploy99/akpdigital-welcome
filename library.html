<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Library of Feelings — AKP Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #e8ddd0;
      --title: #6b4a32;
      --heading: #3a2510;
      --body: #4a3020;
      --label: #5a3e28;
      --gold: #7a4e18;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      font-family: 'Josefin Sans', sans-serif;
      overflow-x: hidden; min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 10% 10%, rgba(255,240,215,0.55) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 90%, rgba(200,170,135,0.3) 0%, transparent 50%);
      pointer-events: none;
    }

    /* HERO */
    .hero {
      position: relative; z-index: 10;
      text-align: center; padding: 90px 24px 52px;
    }
    .hero-eyebrow {
      font-weight: 300; font-size: 11px; letter-spacing: 0.5em;
      color: var(--label); text-transform: uppercase; margin-bottom: 22px;
      opacity: 0; animation: fade-up 1.2s ease forwards 0.3s;
    }
    .hero-title {
      font-family: 'Cormorant Garamond', serif; font-weight: 300;
      font-size: clamp(36px, 7vw, 64px);
      color: var(--title);
      line-height: 1.1; letter-spacing: -0.01em;
      opacity: 0; animation: fade-up 1.2s ease forwards 0.5s;
    }
    .hero-title em { font-style: italic; color: var(--title); opacity: 0.8; }
    .hero-sub {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 17px; color: var(--body); margin-top: 14px; letter-spacing: 0.04em;
      opacity: 0; animation: fade-up 1.2s ease forwards 0.7s;
    }
    .hero-divider {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-top: 32px;
      opacity: 0; animation: fade-up 1.2s ease forwards 0.9s;
    }
    .hdl { width: 50px; height: 1px; background: linear-gradient(to right, transparent, var(--gold)); opacity: 0.6; }
    .hdl.r { background: linear-gradient(to left, transparent, var(--gold)); }
    .hdd { width: 4px; height: 4px; background: var(--gold); transform: rotate(45deg); opacity: 0.7; }

    /* COLLECTION HEADER */
    .collection-header {
      position: relative; z-index: 10;
      text-align: center; padding: 0 24px 36px;
      opacity: 0; animation: fade-up 1.2s ease forwards 1s;
    }
    .collection-name {
      font-family: 'Cormorant Garamond', serif; font-weight: 300; font-style: italic;
      font-size: clamp(26px, 4vw, 38px); color: var(--heading);
      line-height: 1.2; margin-bottom: 8px;
    }
    .collection-tagline {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 14px; color: var(--body); letter-spacing: 0.06em;
      opacity: 0.8;
    }
    .collection-divider {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; margin-top: 20px;
    }

    /* LETTER GRID */
    .letter-grid {
      position: relative; z-index: 10;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px; padding: 0 28px 72px;
      max-width: 960px; margin: 0 auto;
    }

    .letter-card {
      position: relative; border-radius: 3px; overflow: hidden;
      cursor: pointer;
      opacity: 0; animation: fade-up 1s ease forwards;
      transition: transform 0.5s ease, box-shadow 0.5s ease;
      box-shadow: 0 8px 32px rgba(60,35,10,0.18);
      background: var(--bg);
    }
    .letter-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 60px rgba(60,35,10,0.25);
    }
    .letter-card.coming-soon { cursor: default; opacity: 0.6; }
    .letter-card.coming-soon:hover { transform: none; box-shadow: 0 8px 32px rgba(60,35,10,0.18); }

    .letter-img {
      width: 100%; height: 340px; object-fit: cover; display: block;
      transition: transform 0.6s ease;
    }
    .letter-card:hover:not(.coming-soon) .letter-img { transform: scale(1.04); }

    .letter-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(25,14,5,0.88) 0%, rgba(25,14,5,0.15) 55%, transparent 100%);
      display: flex; flex-direction: column;
      justify-content: flex-end; padding: 28px 24px;
    }
    .letter-tag {
      font-weight: 300; font-size: 10px; letter-spacing: 0.4em;
      text-transform: uppercase; color: rgba(235,205,165,1);
      margin-bottom: 8px;
    }
    .letter-title {
      font-family: 'Cormorant Garamond', serif; font-weight: 300; font-style: italic;
      font-size: clamp(20px, 3vw, 26px);
      color: rgba(255,248,238,1); line-height: 1.2; margin-bottom: 6px;
    }
    .letter-tagline {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 12px; color: rgba(220,195,155,0.85);
      margin-bottom: 16px; letter-spacing: 0.03em;
    }
    .letter-btn {
      font-weight: 300; font-size: 10px; letter-spacing: 0.35em;
      text-transform: uppercase; color: rgba(245,228,200,1);
      border-bottom: 1px solid rgba(215,180,120,0.8);
      padding-bottom: 3px; display: inline-block;
      transition: color 0.3s;
    }
    .letter-card:hover .letter-btn { color: #fff; border-color: rgba(255,255,255,0.6); }

    /* MID DIVIDER */
    .mid-divider {
      position: relative; z-index: 10;
      display: flex; align-items: center; gap: 20px;
      padding: 0 32px 44px; max-width: 960px; margin: 0 auto;
      opacity: 0; animation: fade-up 1s ease forwards 1.4s;
    }
    .mid-line { flex: 1; height: 1px; background: rgba(90,62,40,0.25); }
    .mid-text {
      font-weight: 300; font-size: 10px; letter-spacing: 0.5em;
      text-transform: uppercase; color: var(--label); white-space: nowrap;
    }

    /* EXPERIENCE GRID */
    .experience-grid {
      position: relative; z-index: 10;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px; padding: 0 28px 100px;
      max-width: 960px; margin: 0 auto;
    }
    .exp-card {
      border: 1px solid rgba(90,62,40,0.35);
      padding: 26px 14px 22px; text-align: center; cursor: pointer;
      transition: all 0.4s ease;
      opacity: 0; animation: fade-up 0.9s ease forwards;
    }
    .exp-card:hover {
      border-color: rgba(90,62,40,0.7);
      background: rgba(90,62,40,0.07);
      box-shadow: 0 8px 32px rgba(60,35,10,0.1);
      transform: translateY(-4px);
    }
    .exp-icon { font-size: 26px; margin-bottom: 10px; display: block; }
    .exp-title {
      font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 16px;
      color: var(--heading); margin-bottom: 6px;
    }
    .exp-sub {
      font-weight: 300; font-size: 9px; letter-spacing: 0.25em;
      text-transform: uppercase; color: var(--body);
    }

    /* FOOTER */
    .footer-nav {
      position: relative; z-index: 10; text-align: center;
      padding: 0 24px 70px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .footer-line { width: 40px; height: 1px; background: rgba(90,62,40,0.35); margin-bottom: 6px; }
    .footer-btn {
      font-weight: 300; font-size: 10px; letter-spacing: 0.35em;
      text-transform: uppercase; color: var(--label);
      background: transparent; border: none; cursor: pointer;
      transition: color 0.3s; text-decoration: none;
    }
    .footer-btn:hover { color: var(--heading); }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="hero">
    <p class="hero-eyebrow">AKP Digital &nbsp;·&nbsp; Library</p>
    <h1 class="hero-title">The Library of<br><em>Feelings</em></h1>
    <p class="hero-sub">A quiet emotional cinematic library</p>
    <div class="hero-divider">
      <div class="hdl"></div><div class="hdd"></div><div class="hdl r"></div>
    </div>
  </div>

  <div class="collection-header">
    <p class="collection-name">The Letter That Found Its Way Home</p>
    <p class="collection-tagline">Stories, letters, and keepsakes that find their way back to the heart.</p>
    <div class="collection-divider">
      <div class="hdl"></div><div class="hdd"></div><div class="hdl r"></div>
    </div>
  </div>

  <div class="letter-grid" id="letterGrid"></div>

  <div class="mid-divider">
    <div class="mid-line"></div>
    <span class="mid-text">Explore by Experience</span>
    <div class="mid-line"></div>
  </div>

  <div class="experience-grid" id="experienceGrid"></div>

  <div class="footer-nav">
    <div class="footer-line"></div>
    <a href="https://akpdigital.com" class="footer-btn">↩ Return to AKP Digital</a>
  </div>

  <script>
    const letters = [
      {
        title: 'A Letter from the Rainbow Bridge',
        tag: 'Pet Universe · Featured',
        tagline: 'For the love that never truly leaves.',
        image: 'book-rainbow-collection.png',
        link: 'language-select.html?collection=rainbowbridge',
        comingSoon: false,
        delay: '1.1s'
      },
      {
        title: 'Letters from the Quiet Heart',
        tag: 'Pet Universe',
        tagline: 'For the days your heart needs gentleness.',
        image: 'book-quiet.png',
        link: '#',
        comingSoon: true,
        delay: '1.2s'
      },
    ];

    const experiences = [
      { icon: '📖', title: 'Flipbooks',     sub: 'Page by page',    delay: '1.5s' },
      { icon: '🎧', title: 'Audiobooks',    sub: 'Listen & feel',   delay: '1.6s' },
      { icon: '📄', title: 'PDF Editions',  sub: 'Download & read', delay: '1.7s' },
      { icon: '🎞', title: 'Cinematic',     sub: 'Visual stories',  delay: '1.8s' },
      { icon: '🖼', title: 'Photo Art',     sub: 'Art editions',    delay: '1.9s' },
      { icon: '📦', title: 'Bundles',       sub: 'Full experience', delay: '2.0s' },
      { icon: '🌏', title: 'All Languages', sub: 'Global edition',  delay: '2.1s' },
    ];

    document.getElementById('letterGrid').innerHTML = letters.map(l => `
      <div class="letter-card${l.comingSoon ? ' coming-soon' : ''}" style="animation-delay:${l.delay}"
        onclick="${l.comingSoon ? "alert('Coming Soon 🌙\\nเร็วๆ นี้ค่ะ')" : `openLetter('${l.link}')`}">
        <img class="letter-img" src="${l.image}" alt="${l.title}"
          onerror="this.style.height='340px';this.style.background='linear-gradient(135deg,#c4956a,#8b6a4a)'"/>
        <div class="letter-overlay">
          <p class="letter-tag">${l.tag}${l.comingSoon ? ' · Coming Soon' : ''}</p>
          <h2 class="letter-title">${l.title}</h2>
          <p class="letter-tagline">${l.tagline}</p>
          <span class="letter-btn">${l.comingSoon ? 'Coming Soon' : 'Open the Letter →'}</span>
        </div>
      </div>
    `).join('');

    document.getElementById('experienceGrid').innerHTML = experiences.map(e => `
      <div class="exp-card" style="animation-delay:${e.delay}" onclick="alert('Coming Soon 🌙\nเร็วๆ นี้ค่ะ')">
        <span class="exp-icon">${e.icon}</span>
        <p class="exp-title">${e.title}</p>
        <p class="exp-sub">${e.sub}</p>
      </div>
    `).join('');

    function openLetter(link) {
      const password = prompt('กรุณาใส่รหัสผ่านค่ะ\nPlease enter your access code:');
      if (password === 'AKP4102') {
        window.location.href = link + '&token=AKP4102';
      } else if (password !== null) {
        alert('รหัสผ่านไม่ถูกต้องค่ะ\nIncorrect access code. Please check your purchase confirmation.');
      }
    }
  </script>
</body>
</html>
