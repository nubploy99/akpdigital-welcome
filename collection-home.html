<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Letter That Found Its Way Home — AKP Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Josefin+Sans:wght@100;200;300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --cream: #f5ede0;
      --gold: #c9a96e;
      --deep: #2c1a0e;
      --amber: #e8c99a;
      --muted: rgba(245,237,224,0.6);
      --bg: #e8ddd0;
      --title: #6b4a32;
      --label: #5a3e28;
    }
    html, body { width: 100%; min-height: 100vh; background: var(--deep); overflow-x: hidden; }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background-image: url('book-rainbow-collection.png');
      background-size: cover; background-position: center;
      filter: brightness(0.25);
    }
    .overlay {
      position: fixed; inset: 0; z-index: 1;
      background: radial-gradient(ellipse at center, transparent 20%, rgba(20,10,5,0.7) 100%);
    }

    /* HEADER */
    .header {
      position: relative; z-index: 10;
      padding: 52px 24px 0;
      display: flex; flex-direction: column; align-items: center;
      text-align: center;
    }
    .brand {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100; font-size: 10px;
      letter-spacing: 0.45em; color: var(--gold);
      text-transform: uppercase; margin-bottom: 20px;
      opacity: 0; animation: fade-up 1s ease forwards 0.3s;
    }
    .collection-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: clamp(28px, 5vw, 48px);
      color: var(--cream); line-height: 1.2; text-align: center;
      text-shadow: 0 2px 30px rgba(20,10,5,0.8);
      opacity: 0; animation: fade-up 1s ease forwards 0.5s;
    }
    .collection-sub {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 14px; color: var(--amber); margin-top: 8px;
      letter-spacing: 0.06em;
      opacity: 0; animation: fade-up 1s ease forwards 0.7s;
    }
    .divider {
      display: flex; align-items: center; gap: 10px; margin: 24px 0;
      opacity: 0; animation: fade-up 1s ease forwards 0.8s;
    }
    .div-line { width: 40px; height: 1px; background: linear-gradient(to right, transparent, var(--gold)); }
    .div-line.r { background: linear-gradient(to left, transparent, var(--gold)); }
    .div-dot { width: 4px; height: 4px; background: var(--gold); transform: rotate(45deg); }

    /* SERIES */
    .series-label {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100; font-size: 10px;
      letter-spacing: 0.45em; color: rgba(245,237,224,0.4);
      text-transform: uppercase; margin-bottom: 28px;
      opacity: 0; animation: fade-up 1s ease forwards 0.9s;
      position: relative; z-index: 10; text-align: center;
    }

    /* LETTER CARDS */
    .letters-wrap {
      position: relative; z-index: 10;
      padding: 0 24px 60px;
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
    }

    .letter-btn {
      width: 100%; max-width: 340px;
      padding: 18px 24px;
      background: rgba(245,237,224,0.06);
      border: 1px solid rgba(201,169,110,0.4);
      border-radius: 3px;
      color: var(--cream);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; gap: 16px;
      transition: all 0.3s ease;
      text-decoration: none;
      opacity: 0; animation: fade-up 1s ease forwards;
    }
    .letter-btn:nth-child(1) { animation-delay: 1.0s; }
    .letter-btn:nth-child(2) { animation-delay: 1.1s; }
    .letter-btn:nth-child(3) { animation-delay: 1.2s; }
    .letter-btn:nth-child(4) { animation-delay: 1.3s; }

    .letter-btn:hover {
      background: rgba(201,169,110,0.12);
      border-color: rgba(201,169,110,0.8);
      transform: translateY(-2px);
    }
    .letter-btn.coming-soon {
      opacity: 0.4 !important;
      cursor: default;
      animation-delay: 1.1s;
    }
    .letter-btn.coming-soon:hover { transform: none; background: rgba(245,237,224,0.06); border-color: rgba(201,169,110,0.4); }

    .btn-no {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100; font-size: 10px;
      letter-spacing: 0.3em; color: var(--gold);
      min-width: 48px;
    }
    .btn-info { display: flex; flex-direction: column; text-align: left; }
    .btn-title { font-size: 18px; color: var(--cream); line-height: 1.3; }
    .btn-sub {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100; font-size: 9px;
      letter-spacing: 0.25em; color: var(--muted);
      margin-top: 3px; text-transform: uppercase; font-style: normal;
    }

    /* NAV */
    .nav-buttons {
      position: relative; z-index: 10;
      padding: 0 24px 50px;
      display: flex; flex-direction: column;
      align-items: center; gap: 12px;
      opacity: 0; animation: fade-up 1s ease forwards 1.4s;
    }
    .nav-btn {
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 100; font-size: 10px;
      letter-spacing: 0.35em; text-transform: uppercase;
      color: rgba(245,237,224,0.35);
      background: transparent; border: none; cursor: pointer;
      transition: color 0.3s; text-decoration: none;
    }
    .nav-btn:hover { color: var(--gold); }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="overlay"></div>

  <div class="header">
    <p class="brand">AKP Digital &nbsp;·&nbsp; The Letter That Found Its Way Home</p>
    <h1 class="collection-title">Rainbow Bridge Letter</h1>
    <p class="collection-sub">A letter from the love that never left.</p>
    <div class="divider">
      <div class="div-line"></div>
      <div class="div-dot"></div>
      <div class="div-line r"></div>
    </div>
  </div>

  <p class="series-label">Choose your letter</p>

  <div class="letters-wrap" id="lettersWrap"></div>

  <div class="nav-buttons">
    <a href="https://akpdigital.com/library.html" class="nav-btn">📚 The Library of Feelings</a>
    <a href="https://akpdigital.com" class="nav-btn">🌿 Return to AKP Digital</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') || 'en';
    const token = params.get('token') || '';

    // ถ้าไม่มี token ต้องใส่รหัส
    if (token !== 'AKP4102') {
      const password = prompt('กรุณาใส่รหัสผ่านค่ะ\nPlease enter your access code:');
      if (password !== 'AKP4102') {
        document.body.innerHTML = '<div style="color:#f5ede0;text-align:center;padding:80px 24px;font-family:Cormorant Garamond,serif"><h2>Access Denied</h2><p style="margin-top:12px">รหัสผ่านไม่ถูกต้องค่ะ</p><a href="https://akpdigital.com" style="color:#c9a96e;display:block;margin-top:20px">กลับสู่ AKP Digital →</a></div>';
        throw new Error('Access denied');
      }
    }

    const letters = {
      en: [
        { no: 'No.001', title: 'When the Sky Changed Color', flipbook: 'https://heyzine.com/flip-book/56835756a0.html', comingSoon: false },
        { no: 'No.002', title: 'Until We Meet Again',        flipbook: null, comingSoon: true },
        { no: 'No.003', title: 'Always Your Angel',          flipbook: null, comingSoon: true },
        { no: 'No.004', title: 'I Will Wait for You There',  flipbook: null, comingSoon: true },
      ],
      th: [
        { no: 'No.001', title: 'ในวันที่ท้องฟ้าเปลี่ยนสี', flipbook: 'https://heyzine.com/flip-book/d8cd264b61.html', comingSoon: false },
        { no: 'No.002', title: 'จนกว่าเราจะพบกัน',          flipbook: null, comingSoon: true },
        { no: 'No.003', title: 'นายคือนิรันดร์ของฉัน',      flipbook: null, comingSoon: true },
        { no: 'No.004', title: 'ฉันจะรอเธออยู่',            flipbook: null, comingSoon: true },
      ]
    };

    const currentLetters = letters[lang] || letters['en'];

    document.getElementById('lettersWrap').innerHTML = currentLetters.map(l => `
      <div class="letter-btn${l.comingSoon ? ' coming-soon' : ''}"
        onclick="${l.comingSoon ? '' : `openLetter('${l.flipbook}')`}"
        style="cursor:${l.comingSoon ? 'default' : 'pointer'}">
        <span class="btn-no">${l.no}</span>
        <div class="btn-info">
          <span class="btn-title">${l.title}</span>
          <span class="btn-sub">${l.comingSoon ? 'Coming Soon' : 'Open the Letter →'}</span>
        </div>
      </div>
    `).join('');

    function openLetter(url) {
      if (!url) return;
      const fade = document.createElement('div');
      fade.style.cssText = 'position:fixed;inset:0;background:#2c1a0e;opacity:0;z-index:999;transition:opacity 1s ease';
      document.body.appendChild(fade);
      setTimeout(() => fade.style.opacity = '1', 10);
      setTimeout(() => window.location.href = url, 1000);
    }
  </script>

</body>
</html>
